<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - Anime Tracker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="auth.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-3 text-center">Anime Tracker — Login / Create</h3>

            <form id="login-form">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" name="username" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" required>
              </div>

              <div id="message" class="mb-3 text-danger"></div>

              <div class="d-grid">
                <button class="btn btn-primary" type="submit">Login / Create Account</button>
              </div>
            </form>

            <p class="mt-3 text-center text-muted">
              Note: Entering a new username/password will create a new account.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
