<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Anime Tracker</a>
            <button class="btn btn-outline-light" id="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Add/Update Anime Entry</h2>
        <form id="anime-form" class="row g-3 mb-5 border p-3 rounded">
            <input type="hidden" id="_id" value=""> 

            <div class="col-md-6">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" required>
            </div>
            
            <div class="col-md-3">
                <label for="episodes" class="form-label">Total Episodes</label>
                <input type="number" class="form-control" id="episodes" min="1" required>
            </div>
            
            <div class="col-md-3">
                <label for="watched" class="form-label">Watched Episodes</label>
                <input type="number" class="form-control" id="watched" min="0" required>
            </div>
            
            <div class="col-md-6">
                <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select" required>
                    <option value="Watching">Watching</option>
                    <option value="Completed">Completed</option>
                    <option value="Plan to Watch">Plan to Watch</option>
                    <option value="Dropped">Dropped</option>
                </select>
            </div>
            
            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-success me-2" id="submit-btn">Add New Entry</button>
                <button type="button" class="btn btn-secondary" id="reset-btn">Clear Form</button>
            </div>
        </form>

        <h2 class="mt-5">Your Results</h2>
        <table class="table table-dark table-striped table-hover" id="anime-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Episodes</th>
                    <th>Watched</th>
                    <th>Status</th>
                    <th>Progress</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script src="auth.js"></script>
    <script defer src="main.js"></script>
</body>
</html>
